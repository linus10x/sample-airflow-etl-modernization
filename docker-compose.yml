name: airflow-etl-sample

x-warehouse-env: &warehouse-env
  WAREHOUSE_DSN: postgresql://${POSTGRES_USER:-warehouse}:${POSTGRES_PASSWORD:-warehouse}@postgres:5432/${POSTGRES_DB:-warehouse}
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-vendor-drops}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-demo-minio-user}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-demo-minio-pass}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
  DBT_HOST: postgres
  DBT_PORT: "5432"
  DBT_USER: ${POSTGRES_USER:-warehouse}
  DBT_PASSWORD: ${POSTGRES_PASSWORD:-warehouse}
  DBT_DBNAME: ${POSTGRES_DB:-warehouse}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warehouse}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warehouse} -d ${POSTGRES_DB:-warehouse}"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-demo-minio-user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-demo-minio-pass}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  airflow:
    build: ./docker/airflow
    image: airflow-etl-sample:local
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      <<: *warehouse-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-warehouse}:${POSTGRES_PASSWORD:-warehouse}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_UI_USER:-admin}:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "5"
      AIRFLOW__API_AUTH__JWT_SECRET: demo-only-jwt-signing-value-not-a-secret
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/project/dags
      - ./pipeline:/opt/airflow/project/pipeline
      - ./dbt:/opt/airflow/project/dbt
      - ./tests:/opt/airflow/project/tests
      - ./pyproject.toml:/opt/airflow/project/pyproject.toml:ro
      - ./docker/airflow/auth:/opt/airflow/auth
      - ./out:/opt/airflow/project/out
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/monitor/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  pgdata:
  miniodata:
