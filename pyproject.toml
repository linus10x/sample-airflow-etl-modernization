[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airflow-etl-modernization-sample"
version = "0.1.0"
description = "Vendor JSON on S3 to Postgres with Airflow and dbt, on synthetic retail data"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
dependencies = [
  "pydantic>=2.9,<3",
  "boto3>=1.35",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.14",
  "mypy>=1.13",
  "boto3-stubs[s3]>=1.35",
  "pillow>=10",
  "playwright>=1.48",
  "dbt-core>=1.10",
  "dbt-postgres>=1.9",
  "pyyaml>=6",
  "types-pyyaml",
]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.setuptools.package-data]
pipeline = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: needs the compose Postgres and MinIO services (make up)",
  "e2e: needs the full compose stack including Airflow and dbt",
  "dags: runs inside the Airflow image (make test-dags)",
]

[tool.coverage.run]
source = ["pipeline"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt/target", "data/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"pipeline/report.py" = ["E501"]  # embedded HTML and CSS template

[tool.mypy]
python_version = "3.12"
packages = ["pipeline"]
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
